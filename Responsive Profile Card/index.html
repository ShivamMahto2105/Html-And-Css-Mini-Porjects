<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card UI Design</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Free CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>

<body>
    <div class="profile-card">
        <div class="image">
            <img src="photo.png" alt="" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">SHIVAM KUMAR MAHTO</span>
            <span class="job">Enginering Student </span>
        </div>

        <div class="media-buttons">
            <a href="https://www.linkedin.com/in/shivam-kumar-mahto-b7a84a311" style="background-color: #0A66C2;" class="link">
                <i class="fa-brands fa-linkedin"></i></i>
            </a>
            <a href="#" style="background-color:#000000 ;" class="link">
                <i class="fa-brands fa-twitter"></i></i>
            </a>
            <a href="#" style="background-color:#E4405F ;" class="link">
                <i class="fa-brands fa-instagram"></i></i>
            </a>
            <a href="#" style="background-color:#181717 ;" class="link">
                <i class="fa-brands fa-github"></i></i>
            </a>
        </div>

        <div class="buttons">
            <button class="button">Follow</button>
            <button class="button">Message</button>
        </div>
    </div>
</body>

</html>
